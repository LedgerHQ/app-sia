name: "CodeQL"

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - develop
  pull_request:
    # Excluded path: add the paths you want to ignore instead of deleting the workflow
    paths-ignore:
      - '.github/workflows/*.yml'
      - 'tests/*'

permissions:
  contents: read          # Needed for reusable workflows
  security-events: write  # Needed for reusable workflows

jobs:
  analyse:
    name: Analyse
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_codeql_checks.yml@v1
    secrets: inherit
